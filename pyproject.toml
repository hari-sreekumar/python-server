[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hari-sreekumar", email = "haryappu2015@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=5.2.0",
    "openai>=3.46.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
